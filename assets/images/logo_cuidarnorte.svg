<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img"
     aria-label="Cuidar Norte">
  <!-- Logotipo inventado de la segunda Prestadora de ejemplo. No es de nadie:
       existe para que la demostración muestre que cada Prestadora se ve con lo
       suyo, y por eso no se parece en nada al logotipo del producto. Los dos
       colores son los que la siembra ya le carga a esta Prestadora. -->
  <title>Cuidar Norte</title>
  <g fill="none" stroke="#2F5D50" stroke-width="18" stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Dos manos abiertas que sostienen, abiertas hacia arriba -->
    <path d="M70 150 q0 60 90 60 q90 0 90 -60" />
    <path d="M70 150 v-30" />
    <path d="M250 150 v-30" />
  </g>
  <!-- El norte: una aguja que apunta arriba, entre las manos -->
  <path d="M160 30 l38 78 -38 -22 -38 22 Z" fill="#C77D22" />
  <text x="160" y="252" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#2F5D50">Cuidar Norte</text>
</svg>
