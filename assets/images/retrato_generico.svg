<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sin foto">
  <!-- El retrato de quien no cargó ninguno. Antes ese lugar lo ocupaba la cara
       de otra persona, o una imagen traída de un sitio ajeno que ya no existe.
       Es un archivo y no un dibujo pegado en cada pantalla para que se cambie
       en un solo lugar. Los colores van escritos porque un SVG abierto dentro
       de <img> no ve las variables de la hoja de estilos. -->
  <circle cx="50" cy="50" r="50" fill="#e2e8f0"/>
  <circle cx="50" cy="38" r="16" fill="#94a3b8"/>
  <path d="M50 60c-16 0-29 10-32 24a50 50 0 0 0 64 0c-3-14-16-24-32-24z" fill="#94a3b8"/>
</svg>
