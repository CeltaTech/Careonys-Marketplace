<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Pantalla con sesión, no del directorio: no tiene nada que hacer en un buscador. -->
  <meta name="robots" content="noindex, nofollow" />
  <title data-frase="examen.titulo">Evaluaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .examen-pantalla {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
      background: var(--fondo-app);
    }

    .examen-tarjeta {
      width: 100%;
      max-width: 640px;
      align-self: flex-start;
      background: var(--superficie);
      border: 1px solid var(--borde-card);
      border-radius: 16px;
      box-shadow: var(--sombra-card);
      padding: 32px;
    }

    .examen-marca {
      text-align: center;
      margin-bottom: 24px;
    }

    .examen-marca img {
      max-height: 48px;
      margin-bottom: 12px;
    }

    .examen-marca .tenant-name {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--texto-titulo);
    }

    .examen-titulo {
      font-size: 20px;
      font-weight: 800;
      color: var(--texto-titulo);
      margin: 0 0 6px;
    }

    .examen-bajada {
      font-size: 14px;
      line-height: 1.6;
      color: var(--texto-secundario);
      margin: 0 0 20px;
    }

    .examen-aviso {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .examen-aviso.critico {
      background: var(--tono-critico-fondo);
      color: var(--tono-critico-texto);
    }

    .examen-aviso.atencion {
      background: var(--tono-atencion-fondo);
      color: var(--tono-atencion-texto);
    }

    .examen-aviso.info {
      background: var(--tono-info-fondo);
      color: var(--tono-info-texto);
    }

    .examen-aviso.exito {
      background: var(--tono-exito-fondo);
      color: var(--tono-exito-texto);
    }

    .examen-cargando {
      text-align: center;
      color: var(--texto-secundario);
      font-size: 14px;
      padding: 32px 0;
    }

    .examen-lista {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .examen-lista li + li {
      margin-top: 12px;
    }

    .examen-lista button {
      width: 100%;
      text-align: left;
      background: var(--superficie);
      border: 1px solid var(--borde-card);
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      font-family: inherit;
    }

    .examen-lista button:hover {
      border-color: var(--marca-prestadora);
    }

    .examen-lista .nombre {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--texto-titulo);
      margin-bottom: 4px;
    }

    .examen-lista .detalle {
      display: block;
      font-size: 13px;
      color: var(--texto-secundario);
    }

    .examen-pregunta {
      border: 1px solid var(--borde-card);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .examen-pregunta .enunciado {
      font-size: 15px;
      font-weight: 700;
      color: var(--texto-titulo);
      margin: 0 0 14px;
      line-height: 1.5;
    }

    .examen-opcion {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--texto-titulo);
      cursor: pointer;
    }

    .examen-opcion input {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .examen-resultado-cifra {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.1;
      margin: 0 0 4px;
    }

    .examen-pie {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--texto-secundario);
    }

    .examen-pie a {
      color: var(--azul-medio-texto);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="examen-pantalla">
    <div class="examen-tarjeta">

      <div class="examen-marca">
        <img class="tenant-logo" src="assets/images/logotipo.png" alt="" />
        <span class="tenant-name"></span>
      </div>

      <!-- Estado: cargando -->
      <div id="estado-cargando" class="examen-cargando">
        <i class="fas fa-circle-notch fa-spin"></i> <span data-frase="comun.cargando">Cargando…</span>
      </div>

      <!-- Estado: error -->
      <div id="estado-error" style="display:none;">
        <!-- Vacío a propósito, igual que el panel de al lado: qué falló se sabe
             recién cuando falla, así que la clave se la pone el guion desde
             `decirError`. Antes acá estaba escrito «no se pudo conectar con el
             servidor», y eso decía lo que no era cada vez que el servidor sí
             contestaba y lo que contestaba era que no.
             El rótulo del botón nació en la pantalla de acceso y se pide con su
             clave: una clave no se renombra, y la misma frase escrita dos veces
             se traduce dos veces y se corrige una sola. -->
        <div class="examen-aviso critico" id="texto-error"></div>
        <button type="button" class="btn btn-secundario" id="btn-reintentar" style="width:100%;"
          data-frase="acceso.reintentar">
          Reintentar
        </button>
      </div>

      <!-- Estado: vacío -->
      <div id="estado-vacio" style="display:none;">
        <h1 class="examen-titulo" data-frase="examen.titulo">Evaluaciones</h1>
        <!-- Vacío a propósito: cuál de los tres motivos es se sabe recién al
             pedir los datos, así que la clave se la pone el guion. -->
        <p class="examen-bajada" id="texto-vacio"></p>
        <p class="examen-pie"><a href="cursos.html" data-frase="examen.ver_cursos">Ver los cursos</a></p>
      </div>

      <!-- Estado: listo, eligiendo qué rendir -->
      <div id="estado-lista" style="display:none;">
        <h1 class="examen-titulo" data-frase="examen.titulo">Evaluaciones</h1>
        <p class="examen-bajada" data-frase="examen.bajada">
          Las evaluaciones se corrigen en el servidor. El resultado queda registrado en el legajo.
        </p>
        <ul class="examen-lista" id="lista-evaluaciones"></ul>
      </div>

      <!-- Estado: listo, rindiendo -->
      <form id="estado-examen" style="display:none;" novalidate>
        <!-- El nombre de la evaluación y sus condiciones los pone el guion: el
             primero lo escribió alguien de la Prestadora y no se traduce; las
             segundas cambian de frase según cuántas preguntas tenga. -->
        <h1 class="examen-titulo" id="examen-nombre"></h1>
        <p class="examen-bajada" id="examen-condiciones"></p>

        <div id="aviso-intentos" class="examen-aviso info" style="display:none;"></div>
        <div id="aviso-examen" class="examen-aviso critico" style="display:none;"></div>

        <div id="examen-preguntas"></div>

        <button type="submit" class="btn btn-primario" id="btn-entregar" style="width:100%;">
          <span id="texto-btn-entregar" data-frase="examen.entregar">Entregar respuestas</span>
        </button>

        <p class="examen-pie"><a href="#" id="volver-lista" data-frase="examen.volver_lista">Volver a la lista</a></p>
      </form>

      <!-- Estado: listo, ya corregido -->
      <div id="estado-resultado" style="display:none;">
        <div id="resultado-caja" class="examen-aviso">
          <p class="examen-resultado-cifra" id="resultado-porcentaje"></p>
          <p id="resultado-titulo" style="font-weight:700;margin:0 0 6px;"></p>
          <p id="resultado-detalle" style="margin:0;"></p>
        </div>
        <button type="button" class="btn btn-primario" id="btn-otra-vez" style="width:100%;display:none;"
          data-frase="examen.rendir_de_nuevo">
          Rendir de nuevo
        </button>
        <p class="examen-pie"><a href="#" id="volver-lista-2" data-frase="examen.volver_lista">Volver a la lista</a></p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/identidad.js"></script>
  <script src="js/texto.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const paneles = {
      cargando: document.getElementById('estado-cargando'),
      error: document.getElementById('estado-error'),
      vacio: document.getElementById('estado-vacio'),
      lista: document.getElementById('estado-lista'),
      examen: document.getElementById('estado-examen'),
      resultado: document.getElementById('estado-resultado')
    };

    function mostrar(cual) {
      Object.keys(paneles).forEach(nombre => {
        // Vacio y no 'block': asi el panel recupera el display que le dio el CSS.
        // Imponerle 'block' aplasta un panel que sea grid o flex, y no avisa.
        paneles[nombre].style.display = (nombre === cual) ? '' : 'none';
      });
    }

    // Se le pasa **la clave** de la frase, no la frase. Un texto escrito a mano
    // se queda en el idioma en que nació: marcando el elemento con lo que dice,
    // un cambio de idioma con el cartel en pantalla lo alcanza también.
    //
    // Y se pide `traducir`, que espera al catálogo, en vez de `frase`, que no
    // espera: un aviso que se abre mientras la pantalla arranca la llamaría con
    // el archivo todavía en camino y saldría en blanco.
    function avisar(id, clave, huecos, tono) {
      const caja = document.getElementById(id);
      if (!clave) {
        caja.removeAttribute('data-frase');
        caja.removeAttribute('data-huecos');
        caja.textContent = '';
        caja.style.display = 'none';
        return;
      }
      caja.setAttribute('data-frase', clave);
      if (huecos) caja.setAttribute('data-huecos', JSON.stringify(huecos));
      else caja.removeAttribute('data-huecos');
      if (tono) caja.className = 'examen-aviso ' + tono;
      caja.style.display = 'block';
      Catalogo.traducir(caja).then(() => {
        // Una caja que se abre es porque hay algo que decir, así que nunca queda
        // en blanco: si la frase no se resolvió, se dice lo genérico.
        if (!caja.textContent) caja.textContent = Catalogo.frase('error.generico');
      });
    }

    // Los tres motivos por los que esta pantalla no tiene nada que mostrar. Van
    // por clave como todo lo demás; cuál de los tres es lo decide quien llama.
    function decirVacio(clave) {
      const donde = document.getElementById('texto-vacio');
      donde.setAttribute('data-frase', clave);
      Catalogo.traducir(donde);
      mostrar('vacio');
    }

    // Qué dice el panel de error. Quién elige la frase es `claveDeError`, que
    // mira la falla y dice de qué clase es —el detalle técnico se queda en la
    // consola, nunca en la pantalla—, y el texto sale del catálogo como
    // cualquier otro rótulo, así que cambia con el idioma.
    //
    // Está acá y no copiado en cada `catch` porque es la misma decisión tomada
    // tres veces. Prender el panel queda del lado de quien atrapa, en el
    // renglón siguiente: así el `mostrar('error')` con el que termina el
    // `catch` se lee al lado del `mostrar('cargando')` con el que empezó.
    function decirError(err, queSeIntentaba) {
      const donde = document.getElementById('texto-error');
      donde.setAttribute('data-frase', Texto.claveDeError(err, queSeIntentaba));
      Catalogo.traducir(donde);
    }

    function vaciar(id) {
      const nodo = document.getElementById(id);
      while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
      return nodo;
    }

    // Lo que se está rindiendo ahora. El tope de intentos de verdad lo aplica la
    // función que corrige; esto es sólo para no ofrecer un botón que va a fallar.
    let enCurso = null;
    let intentosUsados = 0;

    // --- La lista ---------------------------------------------------------

    // Los dos pedidos van adentro del `try` y no afuera: `getEvaluaciones` y
    // `getIntentosEvaluacion` traen datos y no muestran nada, así que el fallo
    // no lo cuenta ninguno de los dos —les toca a quien muestra—. Sin esto la
    // pantalla se quedaba en «Cargando…» para siempre («los cuatro estados»).
    async function verLista() {
      mostrar('cargando');
      try {
        const evaluaciones = await ClienteDatos.getEvaluaciones();

        if (!evaluaciones || evaluaciones.length === 0) {
          decirVacio('examen.sin_evaluaciones');
          return;
        }

        const intentos = await ClienteDatos.getIntentosEvaluacion();
        const lista = vaciar('lista-evaluaciones');

        evaluaciones.forEach(evaluacion => {
          const propios = intentos.filter(i => i.evaluacion_id === evaluacion.id);
          const aprobada = propios.some(i => i.aprobado);

          const boton = document.createElement('button');
          boton.type = 'button';

          const nombre = document.createElement('span');
          nombre.className = 'nombre';
          // El nombre lo cargó alguien de la Prestadora: es dato, no texto de la
          // pantalla, y por eso es lo único de acá que no pasa por el catálogo.
          nombre.textContent = evaluacion.nombre;

          // Singular y plural son **dos frases distintas y no una armada con
          // pedazos**: «Rendida 3 veces» partido en cachos sale mal en cuanto un
          // idioma ordena distinto o no usa el mismo plural.
          const detalle = document.createElement('span');
          detalle.className = 'detalle';
          if (aprobada) {
            detalle.setAttribute('data-frase', 'examen.aprobada');
          } else if (propios.length === 1) {
            detalle.setAttribute('data-frase', 'examen.rendida_una');
          } else if (propios.length > 1) {
            detalle.setAttribute('data-frase', 'examen.rendida_varias');
            detalle.setAttribute('data-huecos', JSON.stringify({ cuantas: propios.length }));
          } else {
            detalle.setAttribute('data-frase', 'examen.sin_rendir');
          }

          boton.appendChild(nombre);
          boton.appendChild(detalle);
          boton.addEventListener('click', () => abrir(evaluacion.clave));

          const item = document.createElement('li');
          item.appendChild(boton);
          lista.appendChild(item);
        });

        // Una sola vez al final, con la lista ya armada: `traducir` recorre todo
        // lo que cuelga de lo que se le pasa.
        Catalogo.traducir(lista);
        mostrar('lista');
      } catch (err) {
        decirError(err, 'Examen, lista de evaluaciones:');
        mostrar('error');
      }
    }

    // --- El examen --------------------------------------------------------
    // Los enunciados y las opciones se escriben con textContent, nunca con
    // innerHTML: son texto que carga alguien de la Prestadora, y una etiqueta
    // metida ahí adentro se ejecutaría en el navegador de quien rinde.

    // Los dos pedidos van adentro del `try`: `getEvaluacion` y
    // `getIntentosEvaluacion` traen datos y no muestran nada, así que el fallo
    // no lo cuenta ninguno de los dos —eso le toca a quien muestra, que es esta
    // función—. Antes lo atrapaba quien llamaba, y por eso había dos envoltorios
    // distintos según de dónde viniera el pedido; ahora `abrir` responde por sí
    // misma y se la puede llamar desde cualquier lado, incluso desde un botón.
    async function abrir(clave) {
      mostrar('cargando');
      try {
        const evaluacion = await ClienteDatos.getEvaluacion(clave);

        if (!evaluacion || !evaluacion.preguntas || evaluacion.preguntas.length === 0) {
          decirVacio('examen.sin_preguntas');
          return;
        }

        enCurso = evaluacion;
        const propios = await ClienteDatos.getIntentosEvaluacion(evaluacion.id);
        intentosUsados = propios.length;

        document.getElementById('examen-nombre').textContent = evaluacion.nombre;

        // Cuántas preguntas y con qué porcentaje se aprueba: los dos números
        // entran en huecos y cada idioma los pone donde le corresponda.
        const cuantas = evaluacion.preguntas.length;
        const condiciones = document.getElementById('examen-condiciones');
        condiciones.setAttribute('data-frase',
          cuantas === 1 ? 'examen.condiciones_una' : 'examen.condiciones_varias');
        condiciones.setAttribute('data-huecos', JSON.stringify({
          cuantas: cuantas,
          porcentaje: evaluacion.porcentaje_para_aprobar
        }));
        Catalogo.traducir(condiciones);

        const preguntas = vaciar('examen-preguntas');
        evaluacion.preguntas.forEach((pregunta, i) => {
          const caja = document.createElement('div');
          caja.className = 'examen-pregunta';

          const enunciado = document.createElement('p');
          enunciado.className = 'enunciado';
          enunciado.textContent = (i + 1) + '. ' + pregunta.enunciado;
          caja.appendChild(enunciado);

          pregunta.opciones.forEach(opcion => {
            const etiqueta = document.createElement('label');
            etiqueta.className = 'examen-opcion';

            const marca = document.createElement('input');
            marca.type = 'radio';
            marca.name = 'pregunta-' + pregunta.id;
            marca.value = opcion.id;

            const texto = document.createElement('span');
            texto.textContent = opcion.texto;

            etiqueta.appendChild(marca);
            etiqueta.appendChild(texto);
            caja.appendChild(etiqueta);
          });

          preguntas.appendChild(caja);
        });

        const boton = document.getElementById('btn-entregar');
        const quedan = evaluacion.intentos_maximos
          ? evaluacion.intentos_maximos - intentosUsados
          : null;

        avisar('aviso-examen', '');
        if (quedan === null) {
          if (intentosUsados === 1) {
            avisar('aviso-intentos', 'examen.sin_limite_una', null, 'info');
          } else if (intentosUsados > 1) {
            avisar('aviso-intentos', 'examen.sin_limite_varias', { cuantas: intentosUsados }, 'info');
          } else {
            avisar('aviso-intentos', '');
          }
          boton.disabled = false;
        } else if (quedan > 0) {
          if (quedan === 1) {
            avisar('aviso-intentos', 'examen.queda_uno',
              { total: evaluacion.intentos_maximos }, 'info');
          } else {
            avisar('aviso-intentos', 'examen.quedan_varios',
              { cuantos: quedan, total: evaluacion.intentos_maximos }, 'info');
          }
          boton.disabled = false;
        } else {
          if (evaluacion.intentos_maximos === 1) {
            avisar('aviso-intentos', 'examen.una_sola_vez', null, 'atencion');
          } else {
            avisar('aviso-intentos', 'examen.sin_intentos',
              { cuantos: evaluacion.intentos_maximos }, 'atencion');
          }
          boton.disabled = true;
        }

        mostrar('examen');
      } catch (err) {
        decirError(err, 'Examen, apertura de la evaluación:');
        mostrar('error');
      }
    }

    document.getElementById('estado-examen').addEventListener('submit', async (e) => {
      e.preventDefault();
      avisar('aviso-examen', '');

      const respuestas = {};
      let faltan = 0;
      enCurso.preguntas.forEach(pregunta => {
        const elegida = document.querySelector('input[name="pregunta-' + pregunta.id + '"]:checked');
        if (elegida) respuestas[pregunta.id] = elegida.value;
        else faltan += 1;
      });

      if (faltan > 0) {
        if (faltan === 1) avisar('aviso-examen', 'examen.falta_una', null, 'critico');
        else avisar('aviso-examen', 'examen.faltan_varias', { cuantas: faltan }, 'critico');
        return;
      }

      const boton = document.getElementById('btn-entregar');
      const texto = document.getElementById('texto-btn-entregar');

      // El rótulo se cambia nombrando la frase, no escribiendo el texto, para
      // que un cambio de idioma mientras la corrección corre lo alcance igual.
      const rotular = (clave) => {
        texto.setAttribute('data-frase', clave);
        Catalogo.traducir(texto);
      };

      boton.disabled = true;
      rotular('examen.corrigiendo');

      try {
        const resultado = await ClienteDatos.rendirEvaluacion(enCurso.id, respuestas);
        intentosUsados += 1;
        verResultado(resultado);
      } catch (err) {
        // El detalle técnico lo registra `claveDeError` y no sale de la consola;
        // a la pantalla va la frase que corresponde a esa clase de falla.
        avisar('aviso-examen', Texto.claveDeError(err, 'Examen, corrección:'), null, 'critico');
        boton.disabled = false;
      } finally {
        rotular('examen.entregar');
      }
    });

    // --- El resultado -----------------------------------------------------
    // Dice cuántas estuvieron bien, no cuáles. Con dos opciones por pregunta,
    // marcar la que falló es decir cuál era la buena.

    function verResultado(resultado) {
      const aprobado = resultado.aprobado === true;

      document.getElementById('resultado-caja').className =
        'examen-aviso ' + (aprobado ? 'exito' : 'atencion');
      // La cifra es un número y un signo: no hay nada que traducir.
      document.getElementById('resultado-porcentaje').textContent = resultado.porcentaje + '%';

      const titulo = document.getElementById('resultado-titulo');
      titulo.setAttribute('data-frase', aprobado ? 'examen.aprobado' : 'examen.no_aprobado');

      const detalle = document.getElementById('resultado-detalle');
      detalle.setAttribute('data-frase', 'examen.resultado_detalle');
      detalle.setAttribute('data-huecos', JSON.stringify({
        correctas: resultado.respuestas_correctas,
        total: resultado.preguntas_totales,
        porcentaje: resultado.porcentaje_para_aprobar
      }));

      Catalogo.traducir(document.getElementById('estado-resultado'));

      const quedan = enCurso.intentos_maximos
        ? enCurso.intentos_maximos - intentosUsados
        : null;
      const otraVez = document.getElementById('btn-otra-vez');
      otraVez.style.display = (!aprobado && (quedan === null || quedan > 0)) ? 'block' : 'none';

      mostrar('resultado');
    }

    document.getElementById('btn-otra-vez').addEventListener('click', () => abrir(enCurso.clave));
    document.getElementById('volver-lista').addEventListener('click', (e) => {
      e.preventDefault();
      arrancar();
    });
    document.getElementById('volver-lista-2').addEventListener('click', (e) => {
      e.preventDefault();
      arrancar();
    });

    // --- Arranque ---------------------------------------------------------

    async function arrancar() {
      mostrar('cargando');
      try {
        const sesion = await Sesion.requireAuth();
        if (!sesion) return;

        await ClienteDatos.initTenant();

        // La función de la base rechaza igual a quien no tiene legajo, pero
        // conviene decirlo antes de mostrar las preguntas.
        const perfil = await Sesion.perfil();
        if (!perfil || perfil.role !== 'caregiver') {
          decirVacio('examen.no_es_asistente');
          return;
        }

        // Si la dirección nombra una evaluación, se abre esa. Es como llega
        // quien viene de «Mis Capacitaciones», que ya eligió el curso. Si la
        // clave no existe, `abrir` muestra el estado vacío con su explicación,
        // que es mejor que mandarlo de vuelta a empezar.
        const pedida = new URLSearchParams(window.location.search).get('evaluacion');
        if (pedida) await abrir(pedida);
        else await verLista();
      } catch (err) {
        decirError(err, 'Examen, arranque:');
        mostrar('error');
      }
    }

    document.getElementById('btn-reintentar').addEventListener('click', arrancar);

    arrancar();
  </script>
</body>

</html>
